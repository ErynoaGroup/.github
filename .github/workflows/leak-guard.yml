# Reusable leak guard. Free GitHub-hosted runner only. Minimal permissions.
# Caller: jobs.guard.uses: ErynoaGroup/.github/.github/workflows/leak-guard.yml@<sha>
#         with secrets: inherit (or RAGFIT_LEAK_EXTRA: ${{ secrets.RAGFIT_LEAK_EXTRA }})
name: leak-guard
on:
  workflow_call:
    inputs:
      allowed_mentions:
        description: "Space-separated accounts allowed as @-mentions"
        type: string
        default: "ErynoaGroup NiklasJavier dependabot github-actions"
    secrets:
      RAGFIT_LEAK_EXTRA:
        required: false
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ErynoaGroup/.github
          ref: ${{ job.workflow_sha }}
          path: .leak-guard-src
          persist-credentials: false
      - name: Write extra patterns to file (never echoed)
        env:
          EXTRA: ${{ secrets.RAGFIT_LEAK_EXTRA }}
        run: |
          f="$RUNNER_TEMP/leak-extra.txt"
          umask 077; printf '%s\n' "${EXTRA:-}" > "$f"
          echo "LEAK_EXTRA_FILE=$f" >> "$GITHUB_ENV"
          echo "extra patterns loaded: $(grep -cvE '^[[:space:]]*(#|$)' "$f" || true)"
      - name: Scan tracked files
        run: |
          git ls-files -z -- . ':!:.leak-guard-src' | xargs -0 -r .leak-guard-src/leak-guard/scan.sh
      - name: Scan PR title/body
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          ALLOW: ${{ inputs.allowed_mentions }}
        run: |
          set -u
          text=$(printf '%s\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}")
          fail=0
          printf '%s' "$text" | .leak-guard-src/leak-guard/scan.sh --stdin pr-text || fail=1
          allow=$(echo "$ALLOW" | tr ' ' '|')
          n=$(printf '%s' "$text" | sed 's/`[^`]*`//g' | grep -oE '(^|[[:space:](])@[A-Za-z0-9][A-Za-z0-9-]{0,38}' | grep -vcE "@($allow)$" || true)
          if [ "$n" -gt 0 ]; then echo "::error::$n foreign @-mention(s) in PR title/body (use a code span or drop the @)"; fail=1; fi
          exit $fail
      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/leak-extra.txt"
